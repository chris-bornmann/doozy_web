# Checks that run on every PR (and on main): lint, type-check + build, and a
# security audit of the dependencies that ship in the site.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc -b` first, so type errors fail this job.
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Fails on high/critical advisories in production dependencies only: those
      # are what ship to browsers. Dev tooling (Vite dev server, Tailwind's build
      # deps, ...) never reaches users, so it's reported but doesn't fail the check.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all dependencies (informational)
        run: npm audit --audit-level=high || echo "::warning::Dev dependencies have known vulnerabilities; see the output above."
